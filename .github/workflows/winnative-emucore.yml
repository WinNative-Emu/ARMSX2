name: emucore

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"
  push:
    branches: [winnative]

permissions:
  contents: write

env:
  SYNC_BRANCH: winnative
  NDK_VERSION: 27.3.13750724
  ABI: arm64-v8a
  PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winnative
          fetch-depth: 0

      - name: Sync upstream
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(gh repo view "$GITHUB_REPOSITORY" --json parent --jq 'if .parent then .parent.owner.login + "/" + .parent.name else "" end')
          if [ -z "$parent" ]; then
            echo "No upstream parent; building the branch as-is."
            exit 0
          fi
          branch=$(gh repo view "$parent" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "upstream $parent@$branch"
          git config user.name "winnative-ci"
          git config user.email "ci@winnative.dev"
          git remote add upstream "https://github.com/$parent.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/$parent.git"
          git fetch --no-tags upstream "$branch"
          before=$(git rev-parse HEAD)
          git merge --no-edit "upstream/$branch"
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git submodule update --init --recursive
          git push origin "HEAD:$SYNC_BRANCH"
          echo "Merged $(git rev-list --count $before..$after) upstream commit(s)."

      - name: Install toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake python3
          rustup target add aarch64-linux-android
          echo "NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Sync shaderc deps
        run: python3 platforms/android/app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Build variants
        run: |
          CPP="platforms/android/app/src/main/cpp"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          build() {
            name="$1"; page="$2"; bdir="build-$name"
            rm -rf "$bdir"
            cmake -G Ninja -B "$bdir" -S "$CPP" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM="$PLATFORM" \
              -DANDROID=true -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
              -DLTO_PCSX2_CORE=ON \
              -DARMSX2_EMUCORE_LIBRARY_NAME="$name" \
              -DARMSX2_ANDROID_HOST_PAGE_SIZE="$page"
            ninja -C "$bdir" "$name"
            so="$(find "$bdir" -name "lib${name}.so" | head -1)"
            if [ -z "$so" ]; then
              echo "$name produced no .so" >&2
              exit 1
            fi
            "$STRIP" --strip-unneeded "$so" -o "dist/lib${name}.so"
          }
          build emucore_4k 4096
          build emucore_16k 16384
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: emucore
          path: dist/*.so
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=0
          for f in dist/*.so; do
            name=$(basename "$f")
            prev=$(mktemp -d)/"$name"
            if gh release download latest --pattern "$name" --output "$prev" 2>/dev/null && cmp -s "$prev" "$f"; then
              echo "$name unchanged"
            else
              echo "$name changed"
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "Every artifact is byte-identical to the published release; nothing to publish."
            exit 0
          fi
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "arm64-v8a build from ${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/*.so --clobber
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title latest --notes "Rolling build."
          fi
          gh release upload latest dist/*.so --clobber
          gh release edit latest --notes "Rolling; newest immutable tag: $tag"
          echo "$tag"
